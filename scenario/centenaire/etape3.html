<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Nabuzoko — Code PigPen</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Lora:ital@0;1&display=swap" rel="stylesheet">
  <style>
    @page { size: A5; margin: 1.2cm; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #f0e8d0;
      font-family: 'Lora', serif;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.2rem;
      min-height: 100vh;
      justify-content: center;
    }
    h1 {
      font-family: 'Cinzel Decorative', serif;
      font-size: 1.05rem;
      color: #3a2005;
      text-align: center;
    }
    .subtitle {
      font-size: 0.82rem;
      color: #7a4f1a;
      text-align: center;
      font-style: italic;
    }
    .card {
      background: #fdf6e3;
      border: 2px solid #8b6030;
      border-radius: 4px;
      padding: 1.4rem 1.6rem;
      width: 100%;
      max-width: 650px;
      box-shadow: 3px 4px 10px rgba(0,0,0,0.2);
    }
    .card h2 {
      font-family: 'Cinzel Decorative', serif;
      font-size: 0.82rem;
      color: #4a2a08;
      text-align: center;
      margin-bottom: 1rem;
    }
    .pigpen-img {
      width: 100%;
      max-width: 320px;
      display: block;
      margin: 0 auto;
      border-radius: 2px;
    }
    .note {
      margin-top: 1rem;
      padding: 0.5rem 0.8rem;
      background: rgba(139,96,48,0.08);
      border: 1px solid rgba(139,96,48,0.35);
      border-radius: 3px;
      font-size: 0.75rem;
      color: #5a3810;
      text-align: center;
      font-style: italic;
      line-height: 1.6;
    }
    @media print { body { background: white; } .card { box-shadow: none; } }
  </style>
</head>
<body>

<div>
  <h1>🐰 Code PigPen — Clé de déchiffrement</h1>
  <p class="subtitle">À conserver tout au long de l'étape 3</p>
</div>

<div class="card">
  <h2>Ta table de correspondance</h2>
  <img class="pigpen-img" src="../banque/PigPen.png" alt="Table du code PigPen — A à Z">
  <div class="note">
    Chaque lettre = la forme dessinée autour d'elle dans la grille.<br>
    Point = deuxième grille (J–R et W–Z).
  </div>
</div>

</body>
</html>
