<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>RIP — Mission 3</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Lora:ital@0;1&display=swap" rel="stylesheet">
  <style>
    @page { size: A5; margin: 1.5cm; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: white;
      font-family: 'Lora', serif;
      padding: 2rem 1.5rem;
      display: flex; flex-direction: column; align-items: center;
      gap: 1.2rem; min-height: 100vh; justify-content: center;
    }

    h1 { font-family: 'Cinzel Decorative', serif; font-size: 1.1rem; color: #1a2a0a; text-align: center; }
    .subtitle { font-size: 0.82rem; color: #4a5a2a; text-align: center; font-style: italic; }

    .card {
      background: rgba(240,238,225,0.95);
      border: 2px solid #4a5a3a;
      border-radius: 2px;
      padding: 1.8rem 2rem;
      width: 100%; max-width: 750px;
      box-shadow: 4px 5px 14px rgba(0,0,0,0.3);
    }
    .card h2 { font-family: 'Cinzel Decorative', serif; font-size: 0.85rem; color: #1a2a0a; text-align: center; margin-bottom: 1.6rem; }

    .message {
      display: flex; justify-content: center; align-items: center;
      flex-wrap: wrap; gap: 6px;
      font-size: 2.1rem; line-height: 1.5; text-align: center;
    }
    .word-gap { width: 16px; flex-shrink: 0; display: inline-block; }

    .blanks {
      display: flex; justify-content: center; gap: 0.4rem;
      flex-wrap: wrap; margin-top: 1.5rem;
    }
    .blank {
      width: 26px; height: 2px; background: #4a5a3a;
      display: inline-block; margin: 0 2px;
    }

    .instruction {
      margin-top: 1.3rem;
      padding: 0.6rem 1rem;
      border: 1px dashed rgba(60,80,30,0.4);
      border-radius: 2px;
      font-size: 0.78rem; color: #2a3a1a; text-align: center;
      font-style: italic; line-height: 1.7;
    }

    @media print { body { background: white; } .card { box-shadow: none; } }
  </style>
</head>
<body>

<div>
  <h1>🐇 Transmission interceptée</h1>
  <p class="subtitle">Code Secret I + Code Secret II requis</p>
</div>

<div class="card">
  <h2>— Mission 3 —</h2>

  <!--
    TABLE A LANGER
    T=🔑(I)  A=🐣(I)  B=🌷(I)
    L=⭐(II)  E=🌱(II)
    A=🐣(I)  L=⭐(II)  A=🐣(I)  N=🐇(II)  G=🌼(I)  E=🌱(II)  R=🍫(I)
  -->
  <div class="message">
    <span>🔑</span><span>🐣</span><span>🌷</span>
    <span class="word-gap"></span>
    <span>⭐</span>
    <span class="word-gap"></span>
    <span>🐣</span><span>⭐</span><span>🐣</span><span>🐇</span><span>🌼</span><span>🌱</span><span>🍫</span>
  </div>

  <br></br>
  
  <!-- Blancs : TABLE(5) A(1) LANGER(6) -->
  <div class="blanks">
    <span class="blank"></span><span class="blank"></span><span class="blank"></span>
    <span class="blank"></span><span class="blank"></span>
    <span style="width:14px"></span>
    <span class="blank"></span>
    <span style="width:14px"></span>
    <span class="blank"></span><span class="blank"></span><span class="blank"></span>
    <span class="blank"></span><span class="blank"></span><span class="blank"></span>
  </div>

  <div class="instruction">
    Code Secret I déchiffre certains émojis · Code Secret II déchiffre les autres<br>
    La réponse indique où chercher le prochain brief.
  </div>
</div>

</body>
</html>
